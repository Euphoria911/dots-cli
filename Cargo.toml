[package]
name = "dots"
version = "0.1.0"
edition = "2021"
authors = ["Euphoria911"]
description = "A tiny, fast dotfile manager with per-machine profiles."
license = "MIT"
repository = "https://github.com/Euphoria911/dots-cli"
readme = "README.md"
keywords = ["dotfiles", "cli", "symlink", "config", "sync"]
categories = ["command-line-utilities"]

[[bin]]
name = "dots"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
colored = "2.1"
dirs = "5.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.13"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
